<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # No public/.htaccess in this repo; route everything else to Laravel.
        FallbackResource /index.php
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

# Free instance has 512 MB. Each mod_php worker is ~30-50 MB, and the queue
# worker and scheduler need room too.
<IfModule mpm_prefork_module>
    StartServers          2
    MinSpareServers       1
    MaxSpareServers       3
    MaxRequestWorkers     6
    MaxConnectionsPerChild 500
</IfModule>
