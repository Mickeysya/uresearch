<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Illustration of a postgraduate workstation room">
  <defs>
    <linearGradient id="wsWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF2F8"/>
      <stop offset="100%" stop-color="#E3E9F3"/>
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#wsWall)"/>
  <rect x="0" y="190" width="400" height="70" fill="#D7DEEA"/>

  <!-- Window -->
  <rect x="24" y="24" width="90" height="110" rx="4" fill="#F7FAFF" stroke="#B9C6DD" stroke-width="3"/>
  <line x1="69" y1="24" x2="69" y2="134" stroke="#B9C6DD" stroke-width="3"/>
  <line x1="24" y1="79" x2="114" y2="79" stroke="#B9C6DD" stroke-width="3"/>
  <circle cx="330" cy="50" r="16" fill="#D9A85A" opacity="0.65"/>

  <!-- Plant -->
  <g transform="translate(350,150)">
    <rect x="-14" y="40" width="28" height="30" rx="3" fill="#8A6B4C"/>
    <path d="M0 40 C -22 18 -16 -10 0 -24 C 16 -10 22 18 0 40 Z" fill="#3E8E63"/>
    <path d="M0 40 C -10 20 -6 0 0 -10 C 6 0 10 20 0 40 Z" fill="#4FA876"/>
  </g>

  <!-- Desk row -->
  <g>
    <rect x="40" y="168" width="320" height="10" rx="2" fill="#284B80"/>
    <rect x="52" y="178" width="8" height="34" fill="#1E3A63"/>
    <rect x="340" y="178" width="8" height="34" fill="#1E3A63"/>
  </g>

  <!-- Monitors + chairs, three workstations -->
  <g>
    <!-- Workstation 1 -->
    <rect x="64" y="140" width="50" height="32" rx="3" fill="#FFFFFF" stroke="#B9C6DD" stroke-width="2"/>
    <rect x="82" y="172" width="14" height="6" fill="#B9C6DD"/>
    <circle cx="89" cy="200" r="16" fill="#D9A85A"/>
    <rect x="81" y="206" width="16" height="22" rx="4" fill="#D9A85A"/>

    <!-- Workstation 2 -->
    <rect x="166" y="140" width="50" height="32" rx="3" fill="#FFFFFF" stroke="#B9C6DD" stroke-width="2"/>
    <rect x="184" y="172" width="14" height="6" fill="#B9C6DD"/>
    <circle cx="191" cy="200" r="16" fill="#284B80"/>
    <rect x="183" y="206" width="16" height="22" rx="4" fill="#284B80"/>

    <!-- Workstation 3 -->
    <rect x="268" y="140" width="50" height="32" rx="3" fill="#FFFFFF" stroke="#B9C6DD" stroke-width="2"/>
    <rect x="286" y="172" width="14" height="6" fill="#B9C6DD"/>
    <circle cx="293" cy="200" r="16" fill="#D9A85A"/>
    <rect x="285" y="206" width="16" height="22" rx="4" fill="#D9A85A"/>
  </g>
</svg>
