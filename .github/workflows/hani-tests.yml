name: Hani Sofia tests

on:
  push:
    branches: [main]

jobs:
  tests:
    name: Examiner Nomination · Conflict Detection · Re-viva
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, zip, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml forces SQLite in memory, a sync queue and the array mailer,
      # so no MySQL or Mailpit service is needed.
      - name: Run Hani tests
        run: php artisan test --log-junit junit.xml tests/Feature/Hani

      - name: Write summary
        if: always()
        run: python3 .github/scripts/test-summary.py "Hani Sofia · test report" "All Hani modules=junit.xml" >> "$GITHUB_STEP_SUMMARY"
