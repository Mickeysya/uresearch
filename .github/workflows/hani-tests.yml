name: Test Hani Sofia automatic test run

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, gd, zip, intl
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml forces SQLite in memory, a sync queue and the array mailer,
      # so no MySQL or Mailpit service is needed.
      - run: php artisan test tests/Feature/Hani
