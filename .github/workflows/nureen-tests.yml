name: Nureen tests

on:
  push:
    branches: [main]

jobs:
  tests:
    # Shows as "Attendance", "GA Extension", ... on the run page instead of "tests".
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one module failing still lets the others report
      matrix:
        include:
          - module: Attendance
            files: tests/Feature/Nureen/Attendance*Test.php
          - module: GA Extension
            files: tests/Feature/Nureen/GaExtension*Test.php
          - module: Supervision
            files: tests/Feature/Nureen/Supervision*Test.php tests/Feature/Nureen/SupervisorSafeguardsTest.php
          - module: Certification
            files: >-
              tests/Feature/Nureen/Certification*Test.php
              tests/Feature/Nureen/CertificateVerificationTest.php
              tests/Feature/Nureen/LettersTest.php
              tests/Feature/Nureen/LetterWorstCaseTest.php
          # A new test file that matches none of the patterns above must be
          # added here, or CI will not run it.
          - module: Shared
            files: >-
              tests/Feature/Nureen/AnalyticsTest.php
              tests/Feature/Nureen/ClientCharter*Test.php
              tests/Feature/Nureen/DocumentPreviewTest.php
              tests/Feature/Nureen/DraftsTest.php
              tests/Feature/Nureen/EmailLinksTest.php
              tests/Feature/Nureen/SeededDocumentsTest.php
              tests/Feature/Nureen/SnapshotChainReachabilityTest.php
              tests/Feature/Nureen/StalledReminderTest.php
              tests/Feature/Nureen/VideoDemoSeederTest.php
              tests/Feature/Nureen/WorkingDayCalendarTest.php

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, zip, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml forces SQLite in memory, a sync queue and the array mailer,
      # so no MySQL or Mailpit service is needed.
      - name: Run ${{ matrix.module }} tests
        run: php artisan test --log-junit junit.xml ${{ matrix.files }}

      - name: Keep the report for the summary job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.module }}
          path: junit.xml
          if-no-files-found: ignore

  # One report for the whole run: overall totals first, then module by module.
  summary:
    name: Summary
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: reports

      - name: Write summary
        run: |
          python3 .github/scripts/test-summary.py "Nureen · test report" \
            "Attendance=reports/junit-Attendance/junit.xml" \
            "GA Extension=reports/junit-GA Extension/junit.xml" \
            "Supervision=reports/junit-Supervision/junit.xml" \
            "Certification=reports/junit-Certification/junit.xml" \
            "Shared=reports/junit-Shared/junit.xml" \
            --functional docs/functional-tests/results.md >> "$GITHUB_STEP_SUMMARY"
